<!DOCTYPE html>
<html>
<head>
<title>Be My Valentine?</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.container {
  background: white;
  padding: 50px 90px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.2);
  position: relative;
}

h1 {
  font-size: 34px;
  color: #ff2f6d;
  margin-bottom: 35px;
}

.button-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  margin: 0 auto;
}

button {
  padding: 14px 45px;
  font-size: 18px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  transition: transform 0.15s ease;
  position: relative;
}

button:hover {
  transform: scale(1.08);
}

#yes {
  background: linear-gradient(135deg, #ff4d6d, #ff758f);
  color: white;
  position: relative;
}

#no {
  background: #666;
  color: white;
  transition: left 0.2s ease, top 0.2s ease;
}

#no.floating {
  position: fixed;
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine? 💖</h1>

  <div class="button-row">
    <button id="yes">Yes 💘</button>
    <button id="no">No 💔</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

function moveNoButton() {
  // Make the button floating on first hover
  if (!noBtn.classList.contains('floating')) {
    noBtn.classList.add('floating');
  }

  let x, y, distance;
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;
  const padding = 10;

  do {
    x = Math.random() * (window.innerWidth - btnWidth - padding * 2) + padding;
    y = Math.random() * (window.innerHeight - btnHeight - padding * 2) + padding;

    const yesRect = yesBtn.getBoundingClientRect();
    const yesCenterX = yesRect.left + yesRect.width / 2;
    const yesCenterY = yesRect.top + yesRect.height / 2;

    const noCenterX = x + btnWidth / 2;
    const noCenterY = y + btnHeight / 2;

    const dx = noCenterX - yesCenterX;
    const dy = noCenterY - yesCenterY;
    distance = Math.sqrt(dx * dx + dy * dy);

  } while (distance < 200);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// Move on hover
noBtn.addEventListener("mouseenter", moveNoButton);

// Move on click attempt
noBtn.addEventListener("click", (e) => {
  e.preventDefault();
  moveNoButton();
});

// Move when mouse gets close
noBtn.addEventListener("mousemove", (e) => {
  if (noBtn.classList.contains('floating')) {
    const rect = noBtn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const distance = Math.sqrt(
      Math.pow(e.clientX - centerX, 2) + 
      Math.pow(e.clientY - centerY, 2)
    );

    // If mouse is very close, move immediately
    if (distance < 50) {
      moveNoButton();
    }
  }
});

document.getElementById("yes").addEventListener("click", () => {
  document.querySelector(".container").innerHTML = `
    <h1 style="color:#ff2f6d;">Best decision ever 😍</h1>
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" width="320" style="border-radius:16px;margin-top:18px;">
  `;
});
</script>

</body>
</html>
